[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
bytecode_hash = "none"
ffi = false
# Mainnet-fork tests live in test/fork and need an RPC. They are excluded from the
# default run so `forge test` passes offline; run them with `FOUNDRY_PROFILE=fork forge test`.
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 256

[profile.fork]
no_match_path = "test/__none__/**"
match_path = "test/fork/**"

[profile.fork.fuzz]
runs = 16

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
